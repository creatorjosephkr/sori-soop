name: Desktop release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      build_only:
        description: 'Build files only, without changing GitHub releases (also allows rebuilding a published version)'
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  release-state:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.check.outputs.build }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Skip rebuilding an already-published version
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.build_only }}
        shell: bash
        run: |
          if [[ "$BUILD_ONLY" == true ]]; then
            echo 'build=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          TAG="v$(cat VERSION | tr -d '\r\n')"
          DRAFT=$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null || true)
          if [[ "$DRAFT" == false ]]; then
            echo 'Published version is immutable; no rebuild is needed.'
            echo 'build=false' >> "$GITHUB_OUTPUT"
          else
            echo 'build=true' >> "$GITHUB_OUTPUT"
          fi
  desktop:
    needs: release-state
    if: needs.release-state.outputs.build == 'true'
    name: Build ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            platform: macos-arm64
          - os: windows-2025
            platform: windows-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 55
    env:
      PYTHONUTF8: '1'
      HF_HUB_DISABLE_TELEMETRY: '1'
      DO_NOT_TRACK: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install build tools
        run: python -m pip install -r requirements-build.txt
      - name: Run tests
        run: python -m unittest discover -s tests
      - name: Build desktop app
        run: python scripts/build_desktop.py
      - name: Check packaged server and real native window (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          python scripts/check_macos_distribution.py artifacts/*.dmg
      - name: Check packaged server and real native window (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $process = Start-Process dist/SoriSoop/SoriSoop.exe -ArgumentList '--self-test','--report','artifacts/windows-server.json' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw 'Packaged server check failed' }
          $process = Start-Process dist/SoriSoop/SoriSoop.exe -ArgumentList '--smoke-ui','--report','artifacts/windows-window.json' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw 'Native window check failed' }
      - name: Prepare a clean background-music runtime
        run: python setup_engine.py
      - name: Prepare the offline translation runtime
        run: python setup_translation.py
      - name: Generate music from Korean description
        run: python scripts/smoke_models.py
      - name: Upload desktop files and check reports
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: desktop-${{ matrix.platform }}
          path: artifacts/*
          if-no-files-found: error
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: failure-${{ matrix.platform }}
          path: |
            artifacts/*.json
            build/pyinstaller/SoriSoop/warn-SoriSoop.txt
          if-no-files-found: ignore
  draft-release:
    needs: [release-state, desktop]
    if: needs.release-state.outputs.build == 'true' && !inputs.build_only && (github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: desktop-*
          path: artifacts
          merge-multiple: true
      - name: Create integrity manifest
        shell: bash
        run: |
          cd artifacts
          sha256sum *.dmg *.zip > SHA256SUMS.txt
      - name: Create a reviewable release draft
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="v$(cat VERSION | tr -d '\r\n')"
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "$TAG" ]]; then
            echo 'Tag and VERSION do not match'
            exit 1
          fi
          if gh release view "$TAG" --json isDraft --jq .isDraft > /tmp/release-draft-state 2>/dev/null; then
            if [[ "$(cat /tmp/release-draft-state)" != true ]]; then
              echo 'Refusing to overwrite an already-published release'
              exit 1
            fi
            gh release edit "$TAG" --target "$GITHUB_SHA" --notes-file "docs/release-${TAG#v}.md"
            gh release upload "$TAG" --clobber artifacts/*.dmg artifacts/*.zip artifacts/SHA256SUMS.txt
          else
            gh release create "$TAG" --target "$GITHUB_SHA" --draft --title "소리숲 $TAG" --notes-file "docs/release-${TAG#v}.md" artifacts/*.dmg artifacts/*.zip artifacts/SHA256SUMS.txt
          fi
